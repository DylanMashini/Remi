# Pinned so `pnpm db:up` keeps using the existing memory-aid-db-1 container and
# memory-aid_pgdata volume after the repo folder was renamed to HackPSU.
name: memory-aid

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoryaid
      POSTGRES_PASSWORD: memoryaid
      POSTGRES_DB: memoryaid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
